<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng ký</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f4f4f4; }
        .box { width:380px; margin:60px auto; background:#fff; padding:24px; border-radius:6px; box-shadow:0 0 8px rgba(0,0,0,.15);}
        input { width:100%; padding:10px; margin:8px 0; box-sizing:border-box; }
        button { width:100%; padding:10px; background:#337ab7; color:#fff; border:none; border-radius:4px; cursor:pointer; }
        .alert { background:#f2dede; color:#a94442; padding:10px; border-radius:4px; margin-bottom:10px; }
    </style>
</head>
<body>
<div class="box">
    <h2>Tạo tài khoản mới</h2>

    <div class="alert" th:if="${alert != null}" th:text="${alert}"></div>

    <form th:action="@{/register}" method="post">
        <input type="text" name="username" placeholder="Tài khoản" required />
        <input type="text" name="fullname" placeholder="Họ tên" required />
        <input type="email" name="email" placeholder="Nhập Email" required />
        <input type="text" name="phone" placeholder="Số điện thoại" required />
        <input type="password" name="password" placeholder="Mật khẩu" required />
        <button type="submit">Tạo tài khoản</button>
    </form>

    <p>Nếu bạn đã có tài khoản? <a th:href="@{/login}">Đăng nhập</a></p>
</div>
</body>
</html>
