<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thêm danh mục</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form-group { margin-bottom: 14px; }
        input[type=text] { padding:8px; width: 300px; }
        button { padding: 8px 16px; margin-right: 8px; }
    </style>
</head>
<body>
    <h2>Thêm danh mục mới</h2>

    <form th:action="@{/admin/category/add}" method="post" enctype="multipart/form-data">
        <div class="form-group">
            <label>Tên danh mục:</label><br/>
            <input type="text" name="name" placeholder="Please enter category name" required />
        </div>
        <div class="form-group">
            <label>Ảnh đại diện:</label><br/>
            <input type="file" name="icon" />
        </div>
        <button type="submit">Thêm</button>
        <a th:href="@{/admin/category/list}"><button type="button">Hủy</button></a>
    </form>
</body>
</html>
