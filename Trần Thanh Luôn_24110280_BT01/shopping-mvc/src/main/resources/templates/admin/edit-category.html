<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chỉnh sửa danh mục</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .form-group { margin-bottom: 14px; }
        input[type=text] { padding:8px; width: 300px; }
        button { padding: 8px 16px; margin-right: 8px; }
        img { display:block; margin-bottom: 10px; border-radius: 4px; }
    </style>
</head>
<body>
    <h2>Chỉnh sửa danh mục</h2>

    <form th:action="@{/admin/category/edit}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" th:value="${category.id}" />

        <div class="form-group">
            <label>Tên danh mục:</label><br/>
            <input type="text" name="name" th:value="${category.name}" required />
        </div>

        <div class="form-group">
            <img th:if="${category.icon != null}" th:src="@{'/image/' + ${category.icon}}" width="150" />
            <label>Ảnh đại diện (để trống nếu không đổi):</label><br/>
            <input type="file" name="icon" />
        </div>

        <button type="submit">Cập nhật</button>
        <a th:href="@{/admin/category/list}"><button type="button">Hủy</button></a>
    </form>
</body>
</html>
